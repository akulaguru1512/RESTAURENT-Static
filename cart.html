<body data-page="cart">
<main id="main">
<section class="page-hero"><div class="container"><div class="section-kicker">Local basket</div><h1>Your cart.</h1><p>Persistent in this browser only. Prices, discounts and tax are calculated from centralized configuration.</p></div></section><section class="section"><div class="container cart-layout"><div class="card" data-cart-items></div><aside class="card summary-card sticky-card"><h3>Order summary</h3><div class="stack"><div class="summary-row"><span>Subtotal</span><strong data-subtotal>₹0</strong></div><div class="summary-row"><span>Discount</span><span data-discount>₹0</span></div><div class="summary-row"><span>Tax</span><span data-tax>₹0</span></div><div class="summary-row total"><span>Total</span><span data-total>₹0</span></div><div class="field"><label>Coupon</label><div class="cluster" style="flex-wrap:nowrap"><input data-coupon-input placeholder="WELCOME10"><button class="btn btn--ghost" type="button" data-apply-coupon>Apply</button></div></div><div class="field"><label>Cooking instructions</label><textarea data-cart-instructions maxlength="300" placeholder="Demo instructions only"></textarea></div><a class="btn btn--primary" href="checkout.html" data-checkout-link>Checkout demo</a><button class="btn btn--ghost" data-clear-cart>Clear cart</button><small>No real payment is collected.</small></div></aside></div></section></main>
</body>
</html>
