<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Kansō Table premium static restaurant demonstration built with HTML, CSS and vanilla JavaScript.">
  <title>Checkout · Kansō Table</title>
  <link rel="icon" href="assets/images/logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/data/menu-data.js"></script>
  <script defer src="js/data/reviews-data.js"></script>
  <script defer src="js/data/offers-data.js"></script>
  <script defer src="js/utils/storage.js"></script>
  <script defer src="js/utils/formatting.js"></script>
  <script defer src="js/utils/validation.js"></script>
  <script defer src="js/utils/notifications.js"></script>
  <script defer src="js/modules/theme.js"></script>
  <script defer src="js/modules/navigation.js"></script>
  <script defer src="js/modules/favorites.js"></script>
  <script defer src="js/modules/cart.js"></script>
  <script defer src="js/modules/menu.js"></script>
  <script defer src="js/modules/orders.js"></script>
  <script defer src="js/modules/checkout.js"></script>
  <script defer src="js/modules/reservations.js"></script>
  <script defer src="js/modules/reviews.js"></script>
  <script defer src="js/modules/profile.js"></script>
  <script defer src="js/modules/admin.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body data-page="checkout">
<main id="main">
<section class="page-hero"><div class="container"><div class="section-kicker">Review order</div><h1>Checkout demonstration.</h1><p>No card number, CVV, banking credential or real payment is requested.</p></div></section><section class="section"><div class="container" data-checkout-page><div class="checkout-layout"><form class="card card__body form-grid" data-checkout-form><div class="demo-note">This is a local-only checkout demonstration. Confirming saves a sample order in localStorage; nothing is sent to restaurant staff.</div><h3>Order type</h3><div class="cluster"><label class="checkbox-row"><input type="radio" name="orderType" value="takeaway" checked> Takeaway</label><label class="checkbox-row"><input type="radio" name="orderType" value="delivery"> Delivery</label><label class="checkbox-row"><input type="radio" name="orderType" value="dine-in"> Dine-in</label></div><div class="form-grid cols-2"><div class="field"><label>Name *</label><input name="name" required><span class="field-error"></span></div><div class="field"><label>Phone *</label><input name="phone" inputmode="numeric" maxlength="10" required><span class="field-error"></span></div><div class="field"><label>Email</label><input name="email" type="email"><span class="field-error"></span></div></div><div data-delivery-fields hidden><div class="field"><label>Delivery address *</label><textarea name="address"></textarea><span class="field-error"></span></div></div><div data-dinein-fields hidden><div class="field"><label>Table / seating details *</label><input name="table" placeholder="e.g. Table 8"><span class="field-error"></span></div></div><div class="field"><label>Delivery / order instructions</label><textarea name="instructions"></textarea></div><button class="btn btn--primary">Review & confirm local demo order</button></form><aside class="card summary-card sticky-card"><h3>Items & total</h3><div class="stack" data-checkout-summary></div></aside></div></div></section></main>
</body>
</html>
