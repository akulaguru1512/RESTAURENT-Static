<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Kansō Table local profile login demonstration."
  >

  <title>Login · Kansō Table</title>

  <link
    rel="icon"
    href="assets/images/logo-mark.svg"
    type="image/svg+xml"
  >


  <!-- ============================= -->
  <!-- EXISTING APPLICATION CSS      -->
  <!-- ============================= -->

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">


  <!-- ============================= -->
  <!-- LOGIN CSS - KEEP THIS LAST     -->
  <!-- ============================= -->

  <link rel="stylesheet" href="css/login-circle.css">


  <!-- ============================= -->
  <!-- EXISTING APPLICATION JS       -->
  <!-- ============================= -->

  <script defer src="js/config.js"></script>
  <script defer src="js/data/menu-data.js"></script>
  <script defer src="js/data/reviews-data.js"></script>
  <script defer src="js/data/offers-data.js"></script>

  <script defer src="js/utils/storage.js"></script>
  <script defer src="js/utils/formatting.js"></script>
  <script defer src="js/utils/validation.js"></script>
  <script defer src="js/utils/notifications.js"></script>

  <script defer src="js/modules/theme.js"></script>
  <script defer src="js/modules/favorites.js"></script>
  <script defer src="js/modules/cart.js"></script>


  <!-- ============================= -->
  <!-- LOGIN JS                       -->
  <!-- ============================= -->

  <script defer src="js/modules/login-circle.js"></script>

</head>


<body data-page="login">

  <main class="circle-login-page">

    <!-- Back to home -->

    <a
      href="index.html"
      class="circle-login-home"
      aria-label="Return to Kansō Table home"
    >
      <span aria-hidden="true">←</span>
      <span>Back to home</span>
    </a>


    <!-- Main circular card -->

    <section
      class="circle-login-card"
      id="authCard"
      aria-labelledby="formTitle"
    >

      <!-- Top brand -->

      <div class="circle-login-brand">

        <div class="circle-login-logo">
          間
        </div>

        <div class="circle-login-brand-text">

          <strong>
            Kansō Table
          </strong>

          <small>
            Hyderabad · Contemporary dining
          </small>

        </div>

      </div>


      <!-- Demo label -->

      <div class="circle-login-badge-row">

        <span class="circle-login-badge">
          Local profile demo
        </span>

        <span
          class="circle-login-japanese"
          aria-hidden="true"
        >
          簡素
        </span>

      </div>


      <!-- Title -->

      <h1
        class="circle-login-title"
        id="formTitle"
      >
        Welcome back.
      </h1>


      <p
        class="circle-login-subtitle"
        id="formSubtitle"
      >
        Sign in to continue to your Kansō Table profile.
      </p>


      <!-- ============================= -->
      <!-- FORM                           -->
      <!-- ============================= -->

      <form
        id="accountForm"
        class="circle-login-form"
        novalidate
      >


        <!-- Display name -->

        <div class="circle-field">

          <span
            class="circle-field-icon"
            aria-hidden="true"
          >
            ◎
          </span>

          <label
            class="circle-sr-only"
            for="username"
          >
            Display name
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Display name"
            autocomplete="username"
            required
          >

        </div>


        <!-- Email - signup only -->

        <div
          class="circle-field"
          id="emailBox"
          hidden
        >

          <span
            class="circle-field-icon"
            aria-hidden="true"
          >
            ✉
          </span>

          <label
            class="circle-sr-only"
            for="email"
          >
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email address"
            autocomplete="email"
          >

        </div>


        <!-- Password -->

        <div class="circle-field">

          <span
            class="circle-field-icon"
            aria-hidden="true"
          >
            ◇
          </span>

          <label
            class="circle-sr-only"
            for="password"
          >
            Passphrase
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Passphrase"
            autocomplete="current-password"
            minlength="6"
            required
          >

          <button
            type="button"
            id="togglePassword"
            class="circle-password-toggle"
            aria-label="Show password"
          >
            Show
          </button>

        </div>


        <!-- Confirm password - signup only -->

        <div
          class="circle-field"
          id="confirmBox"
          hidden
        >

          <span
            class="circle-field-icon"
            aria-hidden="true"
          >
            ◇
          </span>

          <label
            class="circle-sr-only"
            for="confirmPassword"
          >
            Confirm passphrase
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm passphrase"
            autocomplete="new-password"
          >

        </div>


        <!-- Login options -->

        <div
          class="circle-login-options"
          id="loginOptions"
        >

          <label class="circle-remember">

            <input
              type="checkbox"
              id="remember"
            >

            <span>
              Remember browser
            </span>

          </label>


          <button
            type="button"
            class="circle-text-button"
            id="forgotLink"
          >
            Forgot passphrase?
          </button>

        </div>


        <!-- Submit -->

        <button
          type="submit"
          class="circle-login-submit"
          id="submitBtn"
        >
          SIGN IN
        </button>


        <!-- Message -->

        <p
          class="circle-login-message"
          id="message"
          role="status"
          aria-live="polite"
        ></p>

      </form>


      <!-- Change mode -->

      <div class="circle-login-switch">

        <span id="switchText">
          New to Kansō Table?
        </span>

        <button
          type="button"
          id="switchLink"
          class="circle-text-button circle-switch-button"
        >
          Create profile
        </button>

      </div>


      <!-- Demo note -->

      <p class="circle-login-demo-note">
        Browser-only demonstration. Your passphrase is
        never stored or sent.
      </p>

    </section>

  </main>


  <script defer src="js/app.js"></script>

</body>

</html>
